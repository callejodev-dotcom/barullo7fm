name: Compilar e publicar Barullo 7FM

# A CI común de Escoita (escoita-nucleo): en cada subida compila en Mac, Windows e Linux e pasa
# as probas (tools/probas-ci.sh); ao subir unha etiqueta «v…» publica a versión cos instaladores.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  plugin:
    uses: callejodev-dotcom/escoita-nucleo/.github/workflows/plugin.yml@v0.3.0
    secrets: inherit
    permissions:
      contents: write
